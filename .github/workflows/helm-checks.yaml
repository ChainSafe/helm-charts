name: Helm Checks

on: pull_request

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: azure/setup-helm@v4
      # Install the unittest plugin so the pre-commit hook uses it instead of
      # the Docker image (which runs as non-root and can't write __snapshot__).
      - run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false
      - run: pip install pre-commit
      - run: make install-pre-commit
      - run: make pre-commit

  chart-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: azure/setup-helm@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: helm/chart-testing-action@v2.7.0
      - id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml --target-branch ${{ github.event.repository.default_branch }})
          [ -n "$changed" ] && echo "changed=true" >> "$GITHUB_OUTPUT" || true
      - if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config ct.yaml

  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false
      - run: helm unittest charts/generic-app

  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          curl -sSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - run: scripts/kubeconform-check.sh
