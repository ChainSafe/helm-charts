{{- range $name, $obj := .Values.persistentVolumeClaims }}
{{- if not $obj.enabled }}{{- continue }}{{- end }}
---
apiVersion: {{ $obj.apiVersion | default "v1" }}
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  {{- with $obj.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $obj.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- toYaml $obj.spec | nindent 2 }}
{{- end }}
