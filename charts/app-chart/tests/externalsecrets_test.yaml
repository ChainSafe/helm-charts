suite: externalSecrets
templates:
  - externalsecrets.yaml
tests:
  - it: splices spec verbatim with default apiVersion
    set:
      externalSecrets:
        demo-secret:
          enabled: true
          spec:
            refreshInterval: 5m
            target:
              name: demo-secret
    asserts:
      - isKind: { of: ExternalSecret }
      - equal: { path: apiVersion, value: external-secrets.io/v1 }
      - equal: { path: spec.refreshInterval, value: 5m }
      - equal: { path: spec.target.name, value: demo-secret }
  - it: injects a templated file into target.template.data and appends monitoring
    set:
      externalSecrets:
        demo-secret:
          enabled: true
          templateFiles:
            config.yaml:
              path: files/example-config.yaml
              tpl: true
              appendMonitoringConfig: true
          spec:
            target:
              name: demo-secret
    asserts:
      - matchRegex:
          path: spec.target.template.data["config.yaml"]
          pattern: "name: example"
      - matchRegex:
          path: spec.target.template.data["config.yaml"]
          pattern: "health_check_url: \"/health\""
