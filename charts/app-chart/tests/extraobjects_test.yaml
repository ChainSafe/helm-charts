suite: extraObjects
templates:
  - extra-objects.yaml
tests:
  - it: renders a structured (map) entry verbatim
    set:
      extraObjects:
        - apiVersion: policy/v1
          kind: PodDisruptionBudget
          metadata: { name: demo-pdb }
          spec: { minAvailable: 1 }
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: PodDisruptionBudget }
      - equal: { path: metadata.name, value: demo-pdb }
      - equal: { path: spec.minAvailable, value: 1 }
  - it: renders a templated string entry (tpl-evaluated)
    set:
      extraObjects:
        - |
          apiVersion: v1
          kind: Secret
          metadata:
            name: {{ print "demo-secret" }}
          type: Opaque
    asserts:
      - isKind: { of: Secret }
      - equal: { path: metadata.name, value: demo-secret }
  - it: renders nothing when the list is empty
    set:
      extraObjects: []
    asserts:
      - hasDocuments: { count: 0 }
