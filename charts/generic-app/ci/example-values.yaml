deployments:
  demo:
    enabled: true
    labels: { app: demo }
    spec:
      replicas: 1
      selector:
        matchLabels: { app: demo }
      template:
        metadata:
          labels: { app: demo }
        spec:
          containers:
            - name: demo
              image: nginx:1.27
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 250m, memory: 128Mi }
              ports:
                - name: http
                  containerPort: 8080
services:
  demo:
    enabled: true
    spec:
      type: ClusterIP
      selector: { app: demo }
      ports:
        - name: http
          port: 8080
          targetPort: 8080
configMaps:
  demo-config:
    enabled: true
    data:
      APP_ENV: production
