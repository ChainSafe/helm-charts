suite: monitoringConfig helper
templates:
  - configmaps.yaml
tests:
  - it: monitoring defaults render into an injected templated file
    set:
      configMaps:
        probe:
          enabled: true
          dataFiles:
            out:
              path: files/example-config.yaml
              tpl: true
    asserts:
      - matchRegex:
          path: data.out
          pattern: "name: example"
