---
rules:
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  document-start: disable
  indentation:
    spaces: consistent
    indent-sequences: true
  line-length: disable
  new-line-at-end-of-file: enable
  trailing-spaces: enable
  truthy:
    check-keys: false
